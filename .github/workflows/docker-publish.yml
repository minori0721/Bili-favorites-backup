name: Docker Publish

on:
  push:
    branches:
      - main
      - dev
    tags:
      - "v*.*.*"
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "DEV_NOTES.md"
      - ".github/workflows/docs-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  IMAGE_NAME: minori0721/bili-favorites-backup

jobs:
  docker:
    runs-on: ubuntu-24.04
    concurrency:
      group: bfb-image-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Find successful dev test evidence
        id: dev-tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/dev-test-evidence.mjs

      - name: Check media and resume tools
        if: steps.dev-tests.outputs.reuse != 'true'
        timeout-minutes: 10
        run: |
          command -v aria2c
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
          aria2c --version | head -n 1

      - name: Validate release notes before publishing images
        env:
          BUILD_REF: ${{ github.ref }}
          BUILD_REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          if [[ "$BUILD_REF" == refs/tags/* ]]; then TAG="$BUILD_REF_NAME"; fi
          node scripts/release-notes.mjs "$TAG" > "$RUNNER_TEMP/bfb-release-preview.md"

      - name: Install application dependencies
        run: npm ci

      - name: Test application
        if: steps.dev-tests.outputs.reuse != 'true'
        run: npm test

      - name: Build application
        run: npm run build

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: docker.io/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=sha,prefix=sha-
            type=sha,format=long,prefix=revision-
            type=ref,event=tag

      - name: Capture previous image layers and select caches
        id: layer_cache
        timeout-minutes: 3
        run: node scripts/image-layer-report.mjs prepare "$RUNNER_TEMP/bfb-layer-baseline.json"

      - name: Build and push candidate by digest
        id: image
        uses: docker/build-push-action@v7
        env:
          SOURCE_DATE_EPOCH: "0"
        with:
          context: .
          platforms: linux/amd64
          outputs: type=image,name=docker.io/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BFB_BUILD_REF=${{ github.ref_name }}
            BFB_BUILD_REVISION=${{ github.sha }}
          cache-from: |
            type=gha
            type=registry,ref=docker.io/${{ env.IMAGE_NAME }}:buildcache-dev
            type=registry,ref=docker.io/${{ env.IMAGE_NAME }}:buildcache-main
          cache-to: ${{ steps.layer_cache.outputs.cache_to }}

      - name: Smoke test the candidate image in isolation
        timeout-minutes: 3
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          trap 'docker rm -f bfb-release-smoke >/dev/null 2>&1 || true' EXIT
          docker run -d --name bfb-release-smoke --network none \
            --tmpfs /app/data --tmpfs /app/temp \
            -e EXPECTED_REVISION="$GITHUB_SHA" \
            "docker.io/$IMAGE_NAME@$IMAGE_DIGEST"
          docker exec bfb-release-smoke sh -ec '
            test -x /usr/bin/aria2c
            test -x /usr/local/bin/ffmpeg
            test -x /usr/local/bin/ffprobe
            test -x /usr/local/bin/BBDown
          '
          docker exec bfb-release-smoke node --input-type=module -e '
            import assert from "node:assert/strict";
            import { setTimeout } from "node:timers/promises";
            assert.equal(process.env.BFB_BUILD_REVISION, process.env.EXPECTED_REVISION);
            let ready = false;
            for (let attempt = 0; attempt < 30; attempt++) {
              try {
                const response = await fetch("http://127.0.0.1:3000/login", { signal: AbortSignal.timeout(1000) });
                if (response.status === 200 && (await response.text()).includes("<form")) { ready = true; break; }
              } catch {}
              await setTimeout(1000);
            }
            assert.ok(ready, "Application login page did not become ready");
            const response = await fetch("http://127.0.0.1:3000/api/queue/state");
            assert.equal(response.status, 401);
            console.log("Image revision, startup, SQLite initialization and authentication smoke check passed");
          '

      - name: Report and verify image layer reuse
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: node scripts/image-layer-report.mjs report "$RUNNER_TEMP/bfb-layer-baseline.json"

      - name: Promote verified image tags
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: node scripts/promote-image.mjs

  release:
    needs: docker
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: bfb-release-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Generate notes from the tagged changelog
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release-notes.mjs "$RELEASE_TAG" > "$RUNNER_TEMP/bfb-release-notes.md"
      - name: Publish application release after image success
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/publish-release.mjs "$RELEASE_TAG" "$RUNNER_TEMP/bfb-release-notes.md"
