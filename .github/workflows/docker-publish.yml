name: Docker Publish

on:
  push:
    branches:
      - main
      - dev
    tags:
      - "v*.*.*"
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "DEV_NOTES.md"
      - ".github/workflows/docs-pages.yml"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: minori0721/bili-favorites-backup

jobs:
  docker:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Check media and resume tools
        timeout-minutes: 10
        run: |
          command -v aria2c
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
          aria2c --version | head -n 1

      - name: Validate release notes before publishing images
        env:
          BUILD_REF: ${{ github.ref }}
          BUILD_REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          if [[ "$BUILD_REF" == refs/tags/* ]]; then TAG="$BUILD_REF_NAME"; fi
          node scripts/release-notes.mjs "$TAG" > "$RUNNER_TEMP/bfb-release-preview.md"

      - name: Test and build application
        run: |
          npm ci
          npm test
          npm run build

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: docker.io/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=sha,prefix=sha-
            type=ref,event=tag

      - name: Build and Push
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BFB_BUILD_REF=${{ github.ref_name }}
            BFB_BUILD_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the published image in isolation
        timeout-minutes: 3
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          trap 'docker rm -f bfb-release-smoke >/dev/null 2>&1 || true' EXIT
          docker run -d --name bfb-release-smoke --network none \
            --tmpfs /app/data --tmpfs /app/temp \
            -e EXPECTED_REVISION="$GITHUB_SHA" \
            "docker.io/$IMAGE_NAME@$IMAGE_DIGEST"
          docker exec bfb-release-smoke node --input-type=module -e '
            import assert from "node:assert/strict";
            import { setTimeout } from "node:timers/promises";
            assert.equal(process.env.BFB_BUILD_REVISION, process.env.EXPECTED_REVISION);
            let ready = false;
            for (let attempt = 0; attempt < 30; attempt++) {
              try {
                const response = await fetch("http://127.0.0.1:3000/login", { signal: AbortSignal.timeout(1000) });
                if (response.status === 200 && (await response.text()).includes("<form")) { ready = true; break; }
              } catch {}
              await setTimeout(1000);
            }
            assert.ok(ready, "Application login page did not become ready");
            const response = await fetch("http://127.0.0.1:3000/api/queue/state");
            assert.equal(response.status, 401);
            console.log("Image revision, startup, SQLite initialization and authentication smoke check passed");
          '

  release:
    needs: docker
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: bfb-release-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Generate notes from the tagged changelog
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release-notes.mjs "$RELEASE_TAG" > "$RUNNER_TEMP/bfb-release-notes.md"
      - name: Publish application release after image success
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/publish-release.mjs "$RELEASE_TAG" "$RUNNER_TEMP/bfb-release-notes.md"
