name: Docker Publish

on:
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "DEV_NOTES.md"
      - ".github/workflows/docs-pages.yml"
  workflow_dispatch:
    inputs:
      rebuild_only:
        description: '仅重建镜像：刷新基础镜像和系统补丁，不改应用版本、Release 或原提交镜像标签（仅 dev/main）'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: bfb-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: minori0721/bili-favorites-backup

jobs:
  test:
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Plan SQLite prebuilt cache
        id: sqlite-plan
        run: node scripts/ci-sqlite-cache.mjs plan

      - name: Restore SQLite prebuilt
        id: sqlite-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.sqlite-plan.outputs.archive }}
          key: ${{ steps.sqlite-plan.outputs.key }}

      - name: Validate release notes before publishing images
        env:
          BUILD_REF: ${{ github.ref }}
        run: node scripts/release-notes.mjs --ref "$BUILD_REF" > "$RUNNER_TEMP/bfb-release-preview.md"

      - name: Check media and resume tools
        timeout-minutes: 10
        run: |
          command -v aria2c
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            ubuntu_sources=$(mktemp --suffix=.sources "$RUNNER_TEMP/bfb-media-tools.XXXXXX")
            trap 'rm -f -- "$ubuntu_sources"' EXIT
            apt_options=(
              -o "Dir::Etc::sourcelist=$ubuntu_sources"
              -o "Dir::Etc::sourceparts=-"
              -o Acquire::Retries=1
              -o Acquire::http::Timeout=15
              -o Acquire::https::Timeout=15
            )
            downloaded=false
            download_status=1
            for mirror in https://archive.ubuntu.com/ubuntu/ https://mirrors.edge.kernel.org/ubuntu/; do
              # Match ubuntu-24.04 and retain Ubuntu's archive signature verification.
              printf 'Types: deb\nURIs: %s\nSuites: noble noble-updates noble-backports noble-security\nComponents: main restricted universe multiverse\nSigned-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg\n' "$mirror" > "$ubuntu_sources"
              echo "Downloading media tools from $mirror (180-second limit)"
              # Bound network work only: never interrupt dpkg to retry another mirror.
              if sudo timeout --kill-after=15s 180s bash -e -c '
                apt-get "$@" update --error-on=any
                apt-get "$@" install -y --download-only --no-install-recommends ffmpeg
              ' _ "${apt_options[@]}"; then
                downloaded=true
                break
              else
                download_status=$?
                echo "::warning::Media tool download failed from $mirror (exit $download_status)"
              fi
            done
            if [[ "$downloaded" != true ]]; then
              echo "::error::Both Ubuntu mirrors failed; media tests cannot run."
              exit "$download_status"
            fi
            sudo apt-get "${apt_options[@]}" install -y --no-download --no-install-recommends ffmpeg
          fi
          ffmpeg -version | sed -n '1p'
          ffprobe -version | sed -n '1p'
          aria2c --version | sed -n '1p'

      - name: Install application dependencies
        id: npm-install
        shell: bash
        run: |
          npm ci --foreground-scripts --timing --loglevel=info \
            --logs-dir="$RUNNER_TEMP/bfb-npm-logs" 2>&1 | tee "$RUNNER_TEMP/bfb-npm-install.log"

      - name: Record dependency installation
        id: sqlite-install
        if: ${{ !cancelled() && steps.npm-install.outcome != 'skipped' }}
        env:
          NPM_INSTALL_OUTCOME: ${{ steps.npm-install.outcome }}
        run: node scripts/ci-sqlite-cache.mjs record "$RUNNER_TEMP/bfb-npm-install.log" "$RUNNER_TEMP/bfb-npm-logs"

      - name: Save successfully installed SQLite prebuilt
        if: steps.sqlite-cache.outputs.cache-hit != 'true' && steps.sqlite-install.outputs.save == 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.sqlite-plan.outputs.archive }}
          key: ${{ steps.sqlite-plan.outputs.key }}

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Test application
        run: npm test

  image:
    needs: test
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Configure image publication mode
        id: build-mode
        env:
          INPUT_REBUILD_ONLY: ${{ inputs.rebuild_only }}
        run: node scripts/image-rebuild.mjs configure

      - name: Plan image metadata
        id: publication
        env:
          INPUT_REBUILD_ONLY: ${{ inputs.rebuild_only }}
        run: node scripts/image-rebuild.mjs plan

      # All compilation, type and architecture checks run inside the builder.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: docker.io/${{ env.IMAGE_NAME }}
          flavor: latest=false
          labels: |
            org.opencontainers.image.licenses=GPL-3.0-only
            org.opencontainers.image.version=${{ steps.publication.outputs.version }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=sha,prefix=sha-
            type=sha,format=long,prefix=revision-
            type=raw,value=${{ steps.publication.outputs.release_tag }},enable=${{ steps.publication.outputs.release_tag != '' }}

      - name: Capture previous image layers and select caches
        id: layer_cache
        timeout-minutes: 3
        env:
          INPUT_REBUILD_ONLY: ${{ inputs.rebuild_only }}
        run: node scripts/image-layer-report.mjs prepare "$RUNNER_TEMP/bfb-layer-baseline.json"

      - name: Build and push candidate by digest
        id: image
        uses: docker/build-push-action@v7
        env:
          SOURCE_DATE_EPOCH: "0"
        with:
          context: .
          pull: ${{ steps.build-mode.outputs.rebuild_only == 'true' }}
          no-cache-filters: ${{ steps.build-mode.outputs.rebuild_only == 'true' && 'runtime-tools' || '' }}
          platforms: linux/amd64
          outputs: type=image,name=docker.io/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BFB_BUILD_REF=${{ steps.publication.outputs.build_ref }}
            BFB_BUILD_REVISION=${{ github.sha }}
          cache-from: |
            type=gha
            type=registry,ref=docker.io/${{ env.IMAGE_NAME }}:buildcache-dev
            type=registry,ref=docker.io/${{ env.IMAGE_NAME }}:buildcache-main
          cache-to: ${{ steps.layer_cache.outputs.cache_to }}

      - name: Smoke test the candidate image in isolation
        timeout-minutes: 3
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          trap 'docker rm -f bfb-release-smoke >/dev/null 2>&1 || true' EXIT
          mkdir -p work/candidate-security
          docker run -d --name bfb-release-smoke --network none \
            --cap-drop ALL --security-opt no-new-privileges:true \
            --tmpfs /app/data --tmpfs /app/temp \
            -e EXPECTED_REVISION="$GITHUB_SHA" \
            "docker.io/$IMAGE_NAME@$IMAGE_DIGEST"
          docker exec -i bfb-release-smoke sh -es < scripts/check-image-runtime.sh
          node scripts/image-rebuild.mjs verify-node "$(docker exec bfb-release-smoke node --version)"
          docker cp scripts/image-security-inventory.mjs bfb-release-smoke:/tmp/bfb-image-security.mjs
          docker exec bfb-release-smoke node /tmp/bfb-image-security.mjs > work/candidate-security/runtime.json
          docker exec bfb-release-smoke node --input-type=module -e '
            import assert from "node:assert/strict";
            import fs from "node:fs";
            import { setTimeout } from "node:timers/promises";
            assert.equal(process.env.BFB_BUILD_REVISION, process.env.EXPECTED_REVISION);
            assert.equal(JSON.parse(fs.readFileSync("/app/package.json", "utf8")).license, "GPL-3.0-only");
            for (const file of ["LICENSE", "THIRD_PARTY_NOTICES.md", "THIRD_PARTY_SOURCES.md", "licenses/BBDown-MIT.txt", "licenses/FFmpeg-LGPL-3.0.txt"]) {
              assert.ok(fs.statSync("/app/" + file).size > 0, "Missing packaged license material: " + file);
            }
            let ready = false;
            for (let attempt = 0; attempt < 30; attempt++) {
              try {
                const response = await fetch("http://127.0.0.1:3000/login", { signal: AbortSignal.timeout(1000) });
                if (response.status === 200 && (await response.text()).includes("<form")) { ready = true; break; }
              } catch {}
              await setTimeout(1000);
            }
            assert.ok(ready, "Application login page did not become ready");
            const response = await fetch("http://127.0.0.1:3000/api/queue/state");
            assert.equal(response.status, 401);
            console.log("Image revision, startup, SQLite initialization and authentication smoke check passed");
          '

      - name: Record all candidate image vulnerabilities
        timeout-minutes: 10
        uses: docker/scout-action@v1
        with:
          command: cves
          image: registry://docker.io/${{ env.IMAGE_NAME }}@${{ steps.image.outputs.digest }}
          platform: linux/amd64
          sarif-file: work/candidate-security/scout.sarif.json
          ignore-base: false
          ignore-suppressed: false
          only-vex-affected: false
          write-comment: false

      - name: Reject fixable critical and high image vulnerabilities
        timeout-minutes: 10
        uses: docker/scout-action@v1
        with:
          command: cves
          image: registry://docker.io/${{ env.IMAGE_NAME }}@${{ steps.image.outputs.digest }}
          platform: linux/amd64
          only-fixed: true
          only-severities: critical,high
          ignore-base: false
          ignore-suppressed: false
          only-vex-affected: false
          exit-code: true
          write-comment: false

      - name: Retain candidate security evidence
        if: ${{ always() && steps.image.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: candidate-security-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/candidate-security/
          if-no-files-found: error
          retention-days: 30

      - name: Report and verify image layer reuse
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          INPUT_REBUILD_ONLY: ${{ inputs.rebuild_only }}
        run: node scripts/image-layer-report.mjs report "$RUNNER_TEMP/bfb-layer-baseline.json"

  publish:
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Plan image publication
        id: publication
        env:
          INPUT_REBUILD_ONLY: ${{ inputs.rebuild_only }}
        run: node scripts/image-rebuild.mjs plan

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Check that image-only rebuild is current
        if: steps.publication.outputs.rebuild_only == 'true'
        id: rebuild-current
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_REBUILD_ONLY: ${{ inputs.rebuild_only }}
        run: node scripts/image-rebuild.mjs check-current

      - name: Check that dev publication is current
        if: github.ref == 'refs/heads/dev' && steps.publication.outputs.rebuild_only != 'true'
        id: dev-publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-dev-preview.mjs check

      - name: Check that stable publication is current
        if: steps.publication.outputs.release_tag != ''
        id: stable-publication
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.publication.outputs.release_tag }}
        run: node scripts/publish-release.mjs check "$RELEASE_TAG"

      - name: Promote verified image tags
        id: promote
        if: >-
          (steps.publication.outputs.rebuild_only == 'true' && steps.rebuild-current.outputs.current == 'true') ||
          (steps.publication.outputs.rebuild_only != 'true' &&
          (steps.dev-publication.outputs.current == 'true' || steps.stable-publication.outputs.current == 'true'))
        env:
          IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
          IMAGE_TAGS: ${{ steps.publication.outputs.tags }}
        run: node scripts/promote-image.mjs

      - name: Publish development preview after verified image promotion
        if: steps.promote.outcome == 'success' && github.ref == 'refs/heads/dev' && steps.publication.outputs.rebuild_only != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
        run: node scripts/publish-dev-preview.mjs publish

      - name: Generate stable release notes
        if: steps.promote.outcome == 'success' && steps.publication.outputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ steps.publication.outputs.release_tag }}
        run: node scripts/release-notes.mjs "$RELEASE_TAG" > "$RUNNER_TEMP/bfb-release-notes.md"
      - name: Publish application release after image success
        if: steps.promote.outcome == 'success' && steps.publication.outputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.publication.outputs.release_tag }}
          IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
        run: node scripts/publish-release.mjs publish "$RELEASE_TAG" "$RUNNER_TEMP/bfb-release-notes.md"
