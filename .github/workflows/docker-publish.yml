name: Docker Publish

on:
  push:
    branches:
      - main
      - dev
    tags:
      - "v*.*.*"
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "DEV_NOTES.md"
      - ".github/workflows/docs-pages.yml"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: minori0721/bili-favorites-backup

jobs:
  docker:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Check media and resume tools
        timeout-minutes: 10
        run: |
          command -v aria2c
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
          aria2c --version | head -n 1

      - name: Test and build application
        run: |
          npm ci
          npm test
          npm run build

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: docker.io/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=sha,prefix=sha-
            type=ref,event=tag

      - name: Build and Push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BFB_BUILD_REF=${{ github.ref_name }}
            BFB_BUILD_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: docker
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: bfb-release-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Generate notes from the tagged changelog
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release-notes.mjs "$RELEASE_TAG" > "$RUNNER_TEMP/bfb-release-notes.md"
      - name: Publish application release after image success
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/publish-release.mjs "$RELEASE_TAG" "$RUNNER_TEMP/bfb-release-notes.md"
